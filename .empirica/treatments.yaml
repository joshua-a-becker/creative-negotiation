factors:
    - name: playerCount
      desc: playerCount determines the number of Players are in a Game.
      values:
        - value: 2
    - name: readRoleTime
      values:
        - value: 100000
        - value: 30000
        - value: 300
        - value: 600
    - name: scoringMode
      desc: REQUIRED, no default. How offers are scored. freetext = python scorer on free-text offers; table = pick options from the role's determinatescoretable.
      values:
        - value: freetext
        - value: table
    - name: surveyURL
      desc: YAML post-negotiation survey shown after the outcome page (empty = no survey).
      values:
        - value: https://raw.githubusercontent.com/SamQuinto/Creative-Negotiations-Materials/refs/heads/main/prolific_post_negotiation_survey.yaml
    - name: noAgreementEndingMessage
      values:
        - value: 'You did not reach an agreement. You will receive the base payment in full, but your bonus payment is £0. To complete the task and claim your payment, please click <a href="https://app.prolific.com/submissions/complete?cc=C3VN6N67" style="color: blue; text-decoration: underline; font-weight: bold;">this link</a> to be redirected to Prolific. There is no need to contact the researcher.'
    - name: yesAgreementEndingMessage
      values:
        - value: 'You have successfully reached an agreement. Please click <a href="https://app.prolific.com/submissions/complete?cc=CIJ0LZQK" style="color: blue; text-decoration: underline; font-weight: bold;">this link</a> to complete the task on Prolific and claim your bonus payment. There is no need to contact the researcher.'
    - name: noGameEndingMessage
      values:
        - value: 'We’re sorry, but we were unable to match you with other participants in time (or, on rare occasions, you were disconnected due to an internal server error). Rather than rejecting your submission, we want to compensate you for your time. Please click <a href="https://app.prolific.com/submissions/complete?cc=CSKI2VVJ" style="color: blue; text-decoration: underline; font-weight: bold;">this link</a> to be redirected to Prolific and register your screen-out. There is no need to contact the researcher.'
    - name: batchFullEndingMessage
      values:
        - value: 'Unfortunately, there are too many people interested in the study and all study slots have been taken for now. Rather than rejecting your submission, we want to compensate you partially for your time. Please click <a href="https://app.prolific.com/submissions/complete?cc=CSKI2VVJ" style="color: blue; text-decoration: underline; font-weight: bold;">this link</a> to be redirected to Prolific and register your screen-out. There is no need to contact the researcher.'
    - name: gameTerminatedEndingMessage
      values:
        - value: 'The game ended prematurely because the study window ended or an error occurred. Rather than rejecting your submission, we want to pay you partially for the time and work you have completed. Please click <a href="https://app.prolific.com/submissions/complete?cc=CSKI2VVJ" style="color: blue; text-decoration: underline; font-weight: bold;">this link</a> to be redirected to Prolific and register your screen-out. There is no need to contact the researcher.'
    - name: mainPlaceholderText
      desc: freetext mode only. Placeholder in the offer textarea on the read-role and negotiation stages.
      values:
        - value: Write your offer here. Press Enter or use commas to separate contract features. Include salary, work expense budget, starting date and other job contract features.
    - name: tutorialPlaceholderText
      desc: freetext mode only. Placeholder in the tutorial's offer textarea.
      values:
        - value: Write your offer here, e.g.$300 for the venue on September 15 next year, ending at 9.
    - name: negotiateTime
      values:
        - value: 1800
    - name: experimentalTreatmentText
      desc: Text shown above the role narrative in the negotiation stage.
      values:
        - value: It is important that you carefully understand your own role and the information provided. As you prepare and negotiate, try to keep the role materials in mind and make proposals that reflect the information you have been given.
    - name: roleDataURL
      values:
        - value: https://raw.githubusercontent.com/SamQuinto/Creative-Negotiations-Materials/main/empirica/flexible-215.json
        - value: https://raw.githubusercontent.com/SamQuinto/Creative-Negotiations-Materials/main/empirica/fixed-9.json
